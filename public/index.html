<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Stark Holographic Core Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap');

        :root {
            --emotion-color: #00f3ff;
            --emotion-glow: rgba(0, 243, 255, 0.8);
            --bg-deep: #010409;
            --panel-bg: rgba(1, 15, 30, 0.9);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--emotion-color);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            border: 2px solid var(--emotion-color);
            box-shadow: 0 0 20px var(--emotion-glow);
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel-section {
            border: 1px dashed var(--emotion-color);
            padding: 15px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            height: 450px;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            padding: 8px;
            border-radius: 4px;
        }

        .message.user {
            border-left: 3px solid #ff3333;
            background: rgba(255, 51, 51, 0.1);
        }

        .message.jarvis {
            border-left: 3px solid var(--emotion-color);
            background: rgba(0, 243, 255, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: #000;
            border: 1px solid var(--emotion-color);
            color: var(--emotion-color);
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            border-radius: 4px;
        }

        button {
            background: rgba(0, 243, 255, 0.2);
            border: 1px solid var(--emotion-color);
            color: var(--emotion-color);
            padding: 10px 15px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
        }

        button:hover {
            background: var(--emotion-color);
            color: #000;
            box-shadow: 0 0 10px var(--emotion-glow);
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h2>STARK INDUSTRIES // J.A.R.V.I.S. CLOUD CORE</h2>

    <div class="container">
        <!-- SEÇÃO 1: TERMINAL DE COMANDOS EXECUTIVOS -->
        <div class="panel-section">
            <h3>Terminal de Comandos</h3>
            <div id="command-log" class="chat-box">
                <div class="message jarvis">Terminal operacional pronto para receber ordens de sistema, senhor.</div>
            </div>
            <div class="input-group">
                <input type="text" id="command-input" placeholder="Digite uma ordem ou comando...">
                <button onclick="sendOrder('command')">EXECUTAR</button>
            </div>
        </div>

        <!-- SEÇÃO 2: MATRIZ DE CONVERSA EM TEMPO REAL -->
        <div class="panel-section">
            <h3>Matriz de Diálogo (IA)</h3>
            <div id="chat-log" class="chat-box">
                <div class="message jarvis">Olá, senhor. Como posso auxiliar nos nossos projetos hoje?</div>
            </div>
            <div class="input-group">
                <input type="text" id="chat-input" placeholder="Converse com o J.A.R.V.I.S...." onkeypress="handleKeyPress(event)">
                <button onclick="sendChat()">ENVIAR</button>
            </div>
        </div>
    </div>

    <script>
        async function processRequest(inputId, logId, type) {
            const input = document.getElementById(inputId);
            const log = document.getElementById(logId);
            const prompt = input.value.trim();

            if (!prompt) return;

            // Adiciona mensagem do utilizador
            log.innerHTML += `<div class="message user"><strong>${type === 'command' ? 'COMANDO' : 'SENHOR'}:</strong> ${prompt}</div>`;
            input.value = '';
            log.scrollTop = log.scrollHeight;

            // Mensagem temporária de processamento
            const loadingId = 'load-' + Date.now();
            log.innerHTML += `<div id="${loadingId}" class="message jarvis">A processar dados nos servidores centrais, senhor...</div>`;
            log.scrollTop = log.scrollHeight;

            try {
                const response = await fetch('/api/jarvis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, type })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (response.ok) {
                    log.innerHTML += `<div class="message jarvis"><strong>J.A.R.V.I.S.:</strong> ${data.response}</div>`;
                } else {
                    log.innerHTML += `<div class="message jarvis" style="color: #ff3333;"><strong>ERRO:</strong> ${data.error || 'Falha de comunicação.'}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                log.innerHTML += `<div class="message jarvis" style="color: #ff3333;"><strong>ERRO DE REDE:</strong> Servidor indisponível no momento.</div>`;
            }
            log.scrollTop = log.scrollHeight;
        }

        function sendOrder() {
            processRequest('command-input', 'command-log', 'command');
        }

        function sendChat() {
            processRequest('chat-input', 'chat-log', 'chat');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendChat();
            }
        }
    </script>
</body>
</html>
